      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">8.0 / 15</text>
    </g>
    <g transform="translate(260 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Maps &amp; Local Pack</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">13.0 / 23</text>
    </g>
    <g transform="translate(520 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Organic Search</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">8.0 / 15</text>
    </g>
    <g transform="translate(780 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">AI &amp; Generative</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">16.0 / 20</text>
    </g>
    <g transform="translate(0 86)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Competitive Share</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">4.0 / 10</text>
    </g>
    <g transform="translate(260 86)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Authority &amp; Entity</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">6.0 / 10</text>
    </g>
    <g transform="translate(520 86)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Visibility Resilience</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">3.0 / 5</text>
    </g>
  </g>
  <text x="76" y="752" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="400">Synthetic example. Not a real business. Public Mode · Evidence first · Owner data separate.</text>

</svg>
