    <rect x="0" y="258" width="680" height="94" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="288" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">Competitors win most service clusters</text>
