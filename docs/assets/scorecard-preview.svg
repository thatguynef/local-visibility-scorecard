        <text x="0" y="14" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Organic Search</text>
        <text x="300" y="14" text-anchor="end" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">8 / 15</text>
