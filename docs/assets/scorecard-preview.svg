    <rect x="0" y="40" width="680" height="72" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="66" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">Emergency demand is effectively invisible</text>
    <text x="20" y="94" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFIED</text>
    <text x="170" y="94" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400">16.3% emergency intent coverage.</text>
    <rect x="0" y="120" width="680" height="72" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="146" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">The Local Pack is thin across the market</text>
    <text x="20" y="174" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFIED</text>
    <text x="170" y="174" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400">42.2% top-10 coverage; southwest weakest.</text>
    <rect x="0" y="200" width="680" height="72" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="226" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">Competitors win most service clusters</text>
    <text x="20" y="254" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFIED</text>
    <text x="170" y="254" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400">Only 1 of 6 clusters meets the cohort median.</text>
  </g>
  <g transform="translate(76 590)">
