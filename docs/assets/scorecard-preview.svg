        <text x="360" y="16" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Strong</text>
        <text x="490" y="16" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Absent</text>
        <text x="620" y="16" fill="#A6A6AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Critical</text>
      </g><g transform="translate(0 178)">
        <text x="0" y="16" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">water heaters</text>
        <text x="230" y="16" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Weak</text>
        <text x="360" y="16" fill="#F5C766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Partial</text>
        <text x="490" y="16" fill="#F5C766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Partial</text>
        <text x="620" y="16" fill="#A6A6AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">High</text>
      </g>
  </g>
  <g transform="translate(800 500)">
