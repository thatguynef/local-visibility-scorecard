        <text x="300" y="14" text-anchor="end" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">4 / 10</text>
      </g><g transform="translate(0 188)">
        <text x="0" y="14" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Authority &amp; Entity</text>
        <text x="300" y="14" text-anchor="end" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">6 / 10</text>
      </g><g transform="translate(0 220)">
        <text x="0" y="14" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Resilience</text>
        <text x="300" y="14" text-anchor="end" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">4 / 5</text>
