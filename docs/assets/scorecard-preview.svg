    <text x="20" y="104" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFIED</text>
    <text x="150" y="104" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">14.3% emergency intent coverage.</text>
    <rect x="0" y="150" width="680" height="94" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="180" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">The Local Pack is thin across the market</text>
