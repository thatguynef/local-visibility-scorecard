<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
  <title id="title">Local Visibility Scorecard — find where local customers can and cannot discover the business</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="92%" cy="0%" r="80%">
      <stop offset="0" stop-color="#FF3B3B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0B0B0C"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <g transform="translate(64 56)">
    <circle cx="18" cy="18" r="24" fill="none" stroke="#FF3B3B" stroke-opacity="0.35"/>
    <circle cx="18" cy="18" r="15" fill="none" stroke="#FF3B3B" stroke-opacity="0.55"/>
    <path d="M18 2C10.3 2 4 8.3 4 16c0 10.5 14 24 14 24s14-13.5 14-24C32 8.3 25.7 2 18 2Z" fill="#FF3B3B"/>
    <circle cx="18" cy="16" r="5" fill="#0B0B0C"/>
  </g>
  <text x="120" y="92" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">LOCAL VISIBILITY SCORECARD</text>
  <text x="64" y="166" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.8">Find where local customers can —</text>
  <text x="64" y="218" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.8">and cannot — discover your business.</text>
  <text x="64" y="270" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Search · Maps · AI answers · Competitors · Authority</text>
  <text x="1136" y="270" text-anchor="end" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">PUBLIC MODE</text>

</svg>
